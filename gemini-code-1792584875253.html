<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRF Hammarby Strand – Nyckeltalsjämförelse</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-warm: #f59e0b;
      --accent-danger: #f87171;
      --accent-success: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Lösenordsskärm */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .lock-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 2.5rem;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .lock-box h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .lock-box p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .lock-box input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #0f172a;
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 1rem;
      outline: none;
    }

    .lock-box input:focus {
      border-color: var(--accent);
    }

    .lock-box button {
      width: 100%;
      padding: 0.85rem;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lock-box button:hover {
      background: #7dd3fc;
    }

    .error-msg {
      color: var(--accent-danger);
      font-size: 0.85rem;
      margin-top: 0.75rem;
      display: none;
    }

    /* Presentationscontainer */
    #deck {
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 4rem 5rem 6rem;
      display: none;
      flex-direction: column;
      justify-content: flex-start;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .slide.active {
      display: flex;
      opacity: 1;
    }

    .slide-header {
      margin-bottom: 2rem;
    }

    .slide-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .slide-header h2 {
      font-size: 2.2rem;
      font-weight: 700;
    }

    .slide-content {
      flex: 1;
      display: flex;
      gap: 2rem;
      align-items: stretch;
    }

    /* Tabeller och kort */
    .table-container {
      flex: 2;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.95rem;
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .diff-pos {
      color: var(--accent-danger);
      font-weight: 600;
    }

    .diff-neg {
      color: var(--accent-success);
      font-weight: 600;
    }

    .insight-panel {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .insight-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
    }

    .insight-card.danger {
      border-left: 4px solid var(--accent-danger);
    }

    .insight-card.warning {
      border-left: 4px solid var(--accent-warm);
    }

    .insight-card.success {
      border-left: 4px solid var(--accent-success);
    }

    .insight-card h3 {
      font-size: 1.05rem;
      margin-bottom: 0.5rem;
    }

    .insight-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* Titelsida specifik layout */
    .title-slide {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4rem;
      height: 100%;
      padding: 4rem 6rem;
    }

    .title-left {
      flex: 1.2;
    }

    .title-left h1 {
      font-size: 3.2rem;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .title-left .subtitle {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      line-height: 1.4;
    }

    .meta-tag {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .title-right {
      flex: 1;
      height: 70%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    /* Navigeringskontroller */
    .controls {
      position: fixed;
      bottom: 2rem;
      right: 3rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      z-index: 100;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1rem;
      border-radius: 30px;
      border: 1px solid var(--card-border);
    }

    .controls button {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .controls button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .controls span {
      font-size: 0.85rem;
      color: var(--text-muted);
      min-width: 45px;
      text-align: center;
    }
  </style>
</head>
